# ==============================================
# SISTEMA DE EVENTOS - KPDuels
# ==============================================
events:
  # Defina dentro do servidor com /set-eventos-spawn e /set-eventos-saida.
  spawn: ""
  exit: ""

  # Todos os participantes ficam invulneráveis até o countdown global
  # iniciado por /evento start chegar a 0. A proteção é automática.
  countdown:
    seconds: 10
    chat: "&eO evento começa em &f%time%&e..."
    title: "&a%time%"
    subtitle: "&ePrepare-se!"

  broadcast:
    enabled: true
    interval-seconds: 30
    # Uma mensagem por intervalo; a lista é percorrida em sequência.
    messages:
      - "&b&lEVENTO &7» &fA sala está aberta! Use &a/evento entrar&f para participar."
      - "&b&lEVENTO &7» &fEntre agora! Acesse &a/evento entrar&f."

  messages:
    room-open: "&a&lEVENTO &7» &fA sala de eventos foi aberta! Use &a/evento entrar&f."
    room-closed: "&cA sala de eventos está fechada."
    room-closed-broadcast: "&c&lEVENTO &7» &fA sala de eventos foi fechada."
    join: "&aVocê entrou no evento! Aguarde as instruções da organização."
    leave: "&cVocê saiu do evento."
    pvp-enabled: "&aO PvP do evento foi ativado!"
    pvp-disabled: "&cO PvP do evento foi desativado!"
    started: "&a&lEVENTO &7» &fO evento começou! Boa sorte a todos!"
    stopped: "&c&lEVENTO &7» &fO evento foi encerrado pela organização."
    winner: "&6&lEVENTO &7» &f%player% &avenceu o evento!"

  commands:
    # Executados pelo próprio jogador depois que /evento join concluir com sucesso.
    # Os comandos usam as permissões do jogador (não do console).
    # Placeholders disponíveis: %player%, %uuid% e %event%.
    # Exemplos: "spawn", "kit evento", "effect give %player% speed 5 1"
    on-join-player: []

    # Executados pelo console para cada jogador que estava no evento ao encerrá-lo.
    # Placeholders: %player% e %uuid%.
    on-stop: []
    # Executados pelo console apenas para o vencedor marcado com /setwinner.
    on-winner: []

  # Whitelist de comandos durante o evento (vale para participantes e espectadores).
  command-whitelist:
    enabled: true
    # Para liberar um comando completo, use o caminho com argumentos, ex.: "evento sair".
    # Para liberar todas as sub-rotas de um comando, informe só o nome, ex.: "msg".
    allowed:
      - "evento sair"
      - "evento leave"
      - "event sair"
      - "event leave"
      - "msg"
      - "tell"
      - "w"
      - "whisper"
      - "r"
      - "reply"
    blocked-message: "&cEsse comando não está permitido durante o evento."

  # Locais configurados por /seteventlocal <nome>.
  # Os textos abaixo são enviados individualmente para cada participante puxado.
  pull-locations:
    sumo:
      # Área geral onde os jogadores aguardam antes de /evento puxarsumo.
      location: ""
      # Posições dos dois lados de cada confronto. Defina com:
      # /seteventlocal sumo loc1
      # /seteventlocal sumo loc2
      loc1: ""
      loc2: ""
      instructions:
        - "&e&lSUMO &7» &fVocê foi puxado para o evento de Sumo! Aguarde as instruções."
    1v1:
      # Área geral onde os jogadores aguardam antes de /evento puxar1v1.
      location: ""
      # Posições dos dois lados de cada confronto. Defina com:
      # /seteventlocal 1v1 loc1
      # /seteventlocal 1v1 loc2
      loc1: ""
      loc2: ""
      instructions:
        - "&e&l1V1 &7» &fVocê foi puxado para o evento 1v1! Aguarde as instruções."
    mdr:
      location: ""
      instructions:
        - "&e&lMDR &7» &fVocê foi puxado para o evento MDR! Aguarde as instruções."
    lava:
      location: ""
      instructions:
        - "&e&lLAVA &7» &fVocê recebeu inventário completo de sopas e está sem armadura."
        - "&7Clique com o botão direito para consumir uma sopa e recuperar vida/fome."

    luckyblock:
      location: ""
      instructions: ["&eQuebre os Lucky Blocks de ouro para receber sorte ou azar!"]
    arena:
      location: ""
      instructions: ["&eTodos contra todos! Último sobrevivente vence."]
    sopa:
      location: ""
      instructions: ["&eLute com suas sopas até restar um vencedor!"]
    arco:
      location: ""
      instructions: ["&eCombate de arqueiros. Último em pé vence!"]
    parkour:
      location: ""
      finish: ""
      instructions: ["&eChegue primeiro ao ponto final configurado!"]
    corrida:
      location: ""
      finish: ""
      instructions: ["&eCorra até a linha de chegada!"]
    rei_do_morro:
      location: ""
      point: ""
      instructions: ["&eControle o ponto sozinho para somar pontos!"]

  # Configuração dos confrontos automáticos 1v1 e Sumo.
  # O PvP só é liberado entre os dois jogadores do mesmo par ao chegar em 0.
  pair-matches:
    countdown-seconds: 5
    match-found: "&aVocê foi pareado contra &f%opponent%&a!"
    countdown-chat: "&eA luta começa em &f%time%&e..."
    countdown-title: "&a%time%"
    countdown-subtitle: "&ePrepare-se!"
    started: "&a&lLUTE! &7PvP liberado para este confronto."
    # No Sumo, os hits não causam dano de vida; o knockback é aplicado separadamente.
    sumo-knockback:
      horizontal: 0.55
      vertical: 0.32
    round-reset: "&eUm jogador morreu. O confronto será reiniciado!"
    waiting: "&eVocê está aguardando o próximo adversário."
    opponent-left: "&cSeu adversário saiu do confronto."


  # ==============================================
  # EVENTOS AVANÇADOS - locais definidos por /seteventlocal
  # Não utilize o mundo global: apenas os mundos dos locais configurados.
  # ==============================================
  admin:
    # Mudar clima/hora afeta TODOS os jogadores do mundo selecionado.
    # Fica bloqueado por padrão para não interferir em minigames.
    world-controls-enabled: false
  extra:
    selected: ""
    finish-radius: 2.5
    luckyblock:
      radius: 12
      max-blocks: 12
      spawn-interval-seconds: 20
    hill:
      radius: 4
      points-to-win: 30
    modes:
      luckyblock: {kit: ""}
      arena: {kit: ""}
      sopa: {kit: ""}
      arco: {kit: ""}
      parkour: {kit: ""}
      corrida: {kit: ""}
      rei_do_morro: {kit: ""}
  # Use /seteventlocal <modo> para configurar o ponto de entrada no jogo.
  # Use /seteventlocal parkour finish, corrida finish, rei_do_morro point.
